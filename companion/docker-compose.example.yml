# Add one of these next to your Navidrome service (same compose file).
# Secrets go in a .env file beside the compose file:
#   COMPANION_TOKEN=<openssl rand -hex 24>
#   NAVIDROME_ADMIN_USER=... / NAVIDROME_ADMIN_PASSWORD=...   (optional)
services:

  # Host mode: your own beets on the server imports (see README, "host mode").
  bitchord-companion:
    image: ghcr.io/darioab8/bitchord-nd-companion:latest
    user: "1000:1000"            # the user that owns incoming_music (`id -u`, `id -g`)
    restart: unless-stopped
    ports:
      - "8765:8765"              # LAN / VPN only
    volumes:
      - ./incoming_music:/incoming
      - ./companion:/config      # queue, job list, cookies.txt
    environment:
      - COMPANION_TOKEN=${COMPANION_TOKEN}
      - IMPORT_MODE=host
      # Optional: rescan Navidrome right after beets imports (admin user).
      # - NAVIDROME_URL=http://navidrome:4533
      # - NAVIDROME_USER=${NAVIDROME_ADMIN_USER}
      # - NAVIDROME_PASSWORD=${NAVIDROME_ADMIN_PASSWORD}

  # beets mode, instead: the container's own beets imports into the library.
